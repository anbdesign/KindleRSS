name = "rss-kindle-reader"
main = "src/index.js"
compatibility_date = "2024-09-23"
node_compat = true

# KV namespace for RSS feed caching (5-minute TTL)
# TODO: Once Cloudflare is set up, run:
#   wrangler kv namespace create RSS_CACHE
#   wrangler kv namespace create RSS_CACHE --preview
# Then replace the placeholder IDs below with the real ones.
[[kv_namespaces]]
binding = "RSS_CACHE"
id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
preview_id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Import .ejs files as raw text strings so templates can be bundled
# without filesystem access at runtime
[[rules]]
type = "Text"
globs = ["**/*.ejs"]
